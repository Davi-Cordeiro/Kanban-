<header class="header">
    <div class="header__container">
        <a class="header__brand" href="{% url 'kanban:home' %}">Kanban</a>            

        <nav class="header__nav">
            {% if user.is_authenticated %}
                <span class="header__user">Olá, {{ user.username }}</span>
                    <a class="btn btn-admin" href="/admin">Admin</a>
                    <form method="post" action="{% url 'sair' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-logout">Logout</button>
                    </form>
            {% else %}
                <a class="btn btn-login" href="{% url 'entrar' %}">Login</a>
            {% endif %}
        </nav>
    </div>
</header>
