{% extends "base.html" %}

{% block content %}
    <div class="board_intro">
        <h1 class="home__title">visualizando os detalhes do seu quadro</h1>
        <p class="home__subtitle">Caso não tenha nenhuma etapa, vamos cria-las</p>
    </div>

    {% if listas %}
        <div class="board_list">
            {% for lista in listas%}
                <h2> teste principal {{lista.title}}</h2>
            {% endfor %}
        </div>    

    {% else %}
        <div class="board_list">
            <a href="{% url 'kanban:criacao_de_list' board.pk %}">Criar etapa</a>
        </div>

    {% endif %}
{% endblock content %}
