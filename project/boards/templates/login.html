<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends "base.html" %}
     
    {% block content %}
        <section class="login">
            <h1 class="register__title">Você já possui uma conta existente?</h1>
            <form method="post" class="login__form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-login">Cadastrar</button>
            </form>
        </section>
    {% endblock %}
</body>
</html>
