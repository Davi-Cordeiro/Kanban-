<header class="header">
    <div class="header__container">
        <a class="header__brand" href="{% url 'home' %}">Kanban</a>

        <nav class="header__nav">
            {% if user.is_authenticated %}
                <span class="header__user">Olá, {{ user.username }}</span>

                {# Logout via POST, como o LogoutView do Django exige #}
                <form class="header__logout" method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-logout">Logout</button>
                </form>
            {% else %}
                <a class="btn btn-login" href="{% url 'login' %}">Login</a>
            {% endif %}
        </nav>
    </div>
</header>
