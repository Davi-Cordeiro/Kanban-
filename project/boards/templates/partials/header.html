<header class="header">
    <div class="header__container">
        <a class="header__brand" href="{% url 'home' %}">Kanban</a>

        <nav class="header__nav">
            {% if user.is_authenticated %}
                <span class="header__user">Olá, {{ user.username }}</span>
                    <a class="btn btn-logout" href="{% url 'home' %}">Logout</a>
            {% else %}
                <a class="btn btn-login" href="{% url 'login' %}">Login</a>
            {% endif %}
        </nav>
    </div>
</header>
